version: "3.9"

services:
  # =========================================================
  # REDIS (cache + rate-limit distribuído + pub/sub)
  # =========================================================
  redis:
    image: redis:7-alpine
    container_name: peladeiro-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =========================================================
  # RABBITMQ (mensageria/eventos de domínio)
  # =========================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: peladeiro-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  rabbitmq_data:

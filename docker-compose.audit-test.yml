services:
  audit-postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prontoequipas_audit_test
      POSTGRES_USER: audit_test
      POSTGRES_PASSWORD: audit_test
    ports:
      - '127.0.0.1:55442:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U audit_test -d prontoequipas_audit_test']
      interval: 5s
      timeout: 3s
      retries: 12
    tmpfs:
      - /var/lib/postgresql/data
  audit-redis-test:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:56389:6379'
    command: redis-server --appendonly no --save ''

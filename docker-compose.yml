name: prontoequipas-dev

services:
  api:
    build:
      context: .
      target: development
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3333
      DB_DIALECT: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-prontoequipas}
      DB_USER: ${DB_USER:-prontoequipas}
      DB_PASSWORD: ${DB_PASSWORD:-prontoequipas_dev_only}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-before-use}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      PAYSLIPS_STORAGE_PATH: /app/storage/payslips
    ports:
      - "127.0.0.1:${APP_PORT:-3333}:3333"
    volumes:
      - api_node_modules:/app/node_modules
      - app_storage:/app/storage
      - api_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3333/health/ready',r=>{r.resume();if(r.statusCode!==200)process.exitCode=1}).on('error',()=>process.exitCode=1)"
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-only}
      MYSQL_DATABASE: ${DB_NAME:-prontoequipas}
      MYSQL_USER: ${DB_USER:-prontoequipas}
      MYSQL_PASSWORD: ${DB_PASSWORD:-prontoequipas_dev_only}
    ports:
      - "127.0.0.1:${DB_PORT_EXTERNAL:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT_EXTERNAL:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4-management-alpine}
    profiles: [messaging]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-prontoequipas}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local-rabbitmq-only}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT_EXTERNAL:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  api_node_modules:
  api_logs:
  app_storage:
  mysql_data:
  redis_data:
  rabbitmq_data:
